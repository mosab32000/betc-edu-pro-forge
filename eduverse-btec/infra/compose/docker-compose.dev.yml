version: '3.9'
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: eduverse_dev
    ports:
      - "5432:5432"

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ../../backend
    environment:
      NODE_ENV: development
      PORT: 5000
    depends_on:
      - postgres
      - redis
    ports:
      - "5000:5000"

  ai-service:
    build: ../../ai-service
    environment:
      PORT: 8000
    ports:
      - "8000:8000"

  frontend:
    build: ../../frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5000/api
    depends_on:
      - backend
    ports:
      - "3000:3000"
