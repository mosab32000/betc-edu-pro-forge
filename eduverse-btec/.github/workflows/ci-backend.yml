name: ci-backend
on:
  pull_request:
    paths:
      - 'backend/**'
      - 'scripts/**'
      - '.github/workflows/ci-backend.yml'
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'scripts/**'

jobs:
  backend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate monorepo structure
        run: node eduverse-btec/scripts/check-structure.mjs
      - name: Run AI quality guard
        run: python eduverse-btec/scripts/ai_quality_guard.py --strict
